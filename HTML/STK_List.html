<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" type="image/png" href="assets/Garelabo_Logo.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GARELABO+｜一覧</title>
    <style>
        :root{
            --black:#000000;
            --ink:#f5f5f5;
            --blue:#2a6edc;
            --blue-dk:#1b4fa2;
            --panel:#ffffff;
        }
        *{box-sizing:border-box}
        html,body{margin:0;background:#efefef;color:#222;font-family:Inter, "Noto Sans JP", system-ui, sans-serif}

        /* ====== ヘッダー ====== */
        .header{
            position:relative;
            background:#000;
            color:var(--ink);
            min-height:220px;
            overflow:hidden;
        }
        .header-grid{
            display:grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap:12px;
            align-items:end;
            width:min(1100px,96vw);
            margin:0 auto;
            padding:18px 0 22px;
            height:100%;
        }
        .panel{
            position:relative;
            height:170px;
            border-radius:4px;
            overflow:hidden;
            background:#000000;
        }
        .panel img{
            width:100%;
            height:100%;
            object-fit:cover;
            opacity:.92;
        }

        /* ロゴと右側 */
        .brand-area{
            display:flex;
            flex-direction:column;
            justify-content:space-between;
            height:170px;
            padding:8px 8px 10px;
        }
        .login-btn{
            align-self:flex-end;
            background:#fff;
            color:#111;
            font-size:12px;
            border:none;
            border-radius:4px;
            padding:8px 14px;
            cursor:pointer;
        }
        .brand-row{
            display:flex;
            align-items:center;
            gap:12px;
            margin-top:auto;
        }
        .palm{
            width:46px;height:46px;
            background:url("assets/palm-neon.png") center/contain no-repeat;
            flex:0 0 auto;
            filter: drop-shadow(0 0 2px #00ff95);
        }
        .logo{
            height:40px; width:auto; object-fit:contain;
        }

        /* リボンボタン */
        .ribbons{
            position:absolute;
            bottom:14px;
            left:50%;
            transform:translateX(-50%);
            display:flex;
            gap:14px;
        }
        .ribbon{
            --bg: var(--blue);
            --bg2: var(--blue-dk);
            position:relative;
            padding:12px 22px 12px 42px;
            color:#fff;
            text-decoration:none;
            font-weight:700;
            font-size:14px;
            clip-path:polygon(0 0, calc(100% - 22px) 0, 100% 50%, calc(100% - 22px) 100%, 0 100%);
            background:linear-gradient(135deg,var(--bg),var(--bg2));
            display:inline-flex;
            align-items:center;
            gap:10px;
            min-width:180px;
        }
        .ribbon .icon{
            position:absolute;
            left:12px;
            font-size:18px;
            opacity:.95;
        }

        /* セクション見出し（白字・下線） */
        .section-title{
            position:relative;
            background:#000;
            color:#fff;
            font-weight:900;
            letter-spacing:.2em;
            text-align:center;
            padding:8px 0 10px;
        }
        .section-title::after{
            content:"";
            position:absolute;
            left:0; right:0; bottom:0;
            height:2px;
            background:#fff;
            opacity:.9;
        }

        /* コンテンツ領域 */
        .content{
            min-height:420px;
            background:#fff;
            width:100%;
            padding:18px;
        }

        /* ====== レスポンシブ ====== */
        @media (max-width:980px){
            .ribbons{position:static; transform:none; justify-content:center; margin-top:10px}
            .hero-grid{
                grid-template-columns:1fr 1fr;
            }
            .brand-area{grid-column:1/-1}
        }
        @media (max-width:640px){
            .hero-grid{grid-template-columns:1fr}
            .panel{height:160px}
            .ribbons{flex-direction:column; align-items:center}
            .ribbon{min-width:220px}
        }
    </style>
</head>
<body>

    <!-- ===== ヘッダー ===== -->
    <header class="hero">
        <div class="hero-grid">
            <!-- 左：メーター -->
            <div class="panel">
                <img src="assets/" alt="メーター">
            </div>

            <!-- 中央：リアビュー -->
            <div class="panel">
                <img src="assets/" alt="R34">
            </div>

            <!-- 右：ロゴブロック -->
            <div class="panel brand-area">
                <button class="login-btn">ログイン</button>
                <div class="brand-row">
                    <span class="palm" aria-hidden="true"></span>
                    <img class="logo" src="assets/" alt="GARELABO+">
                </div>
            </div>
        </div>

        <!-- 青いリボンメニュー -->
        <nav class="ribbons" aria-label="メインメニュー">
            <a class="ribbon" href="#build">
                <img src="assets/カスタム作成.png" alt="" width="35" height="35">
                カスタム作成
            </a>
            <a class="ribbon" href="#favorite">
                <img src="assets/お気に入り.png" alt="" width="35" height="35">
                お気に入り<br>一覧
            </a>
        </nav>
    </header>

    <!-- セクション見出し -->
    <div class="section-title">一覧</div>

    <!-- コンテンツ -->
    <main class="content">
        <!-- ここにカードやリストを並べる -->
    </main>

</body>
</html>
