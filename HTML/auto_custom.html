<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>自動カスタム</title>
        <link rel="stylesheet" href="../static/css/auto_custom_style.css">
    </head>

    <body>
        <header>
            <img src="../static/assets/ガレラボ+.png" alt="GARERABO+" class="logo">
            <div class="title-box">
                <img src="../static/assets/自動カスタム.png" alt="custom-icon" class="icon">
                <div class="title-text">
                    <h1>自動カスタム</h1>
                    <p>　　　～ AIが導く、最高の一台へ ～</p>
                </div>
            </div>
        </header>

        <main>
            <!-- カスタム画像表示 -->
            <div class="car-area">
                <img src="" alt="carImage" class="car-img">
                <div class="rotate">
                    <span>⟲ 360°</span>
                </div>
            </div>

            <div class="right-area">
                <!-- ボタン -->
                <div class="btn-row">
                    <button onclick="loadCustomData()">自動カスタム</button>
                    <button onclick="goMenu()">メニューに戻る</button>
                </div>

                <!-- カスタム内容表示 -->
                <div class="custom-box">

                    <h2 class="custom-title">カスタム内容表示▼</h2>

                    <div id="custom-content" class="custom-content">
                        <!-- JSでAIのカスタム結果が入る -->

                        
                    </div>
                    <p class="note">※AIによって自動カスタムされています</p>
                </div>
                    
                <button class="save-btn" onclick="saveCustom()">カスタム内容保存</button>
            </div>
        </main>
        <script src="../static/js/auto_custom.js"></script>
    </body>
</html>
