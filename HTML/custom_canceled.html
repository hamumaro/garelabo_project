<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GARELABO+｜カスタム中止確認</title>

    <link rel="icon" type="image/png" href="../static/assets/Garelabo_Logo.png">
    <link rel="stylesheet" href="../static/css/custom_caneled_style.css">
</head>
<body>

    <!-- 黒ヘッダー -->
    <header class="top-header">
        <div class="top-header-inner">

            <!-- 左：GARELABOロゴ（＋GARELABO+） -->
                <div class="header-logo">
        <a href="List.html">
            <img src="../static/assets/ガレラボ+.png" alt="GARELABO+">
        </a>
    </div>

            <!-- 右：ユーザー名＋さん＋アイコン（DB参照） -->
            <div class="header-user">
            <span class="user-name">{{ user_name }}さん</span>
            <a href="/account" class="user-icon">
                <img src="../static/assets/アカウントアイコン.png" alt="">
                <!-- データベース使用時: src="{{ user_icon_url }}" -->
            </a>
        </div>

        </div>
    </header>

    <!-- メイン（横幅いっぱい） -->
    <main class="cancel-main">
        <h1 class="cancel-title">カスタムを中止しますか？</h1>

        <div class="cancel-buttons">
            <a href="#" class="cancel-btn">YES</a>
            <a href="#" class="cancel-btn">NO</a>
        </div>
    </main>

</body>
</html>
