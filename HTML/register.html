<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset = "UTF-8">
        <title>新規登録</title>
        <link rel="stylesheet" href="../static/css/style.css">
    </head>

    <body>
        <header>
            <img src="../assets/ガレラボ+.png" alt="GARERABO+" class="logo">
        </header>

        <main>
            <h1>新規登録</h1>
            <div class="register-box">
                <form id="registerForm">
                    <div class="form-group">
                        <label for="nickname">ニックネーム</label>
                        <span id="nickname-error" class="error-message"></span>
                        <input type="text" id="nickname" placeholder="ニックネームを入力してください。">
                    </div>
                    <div class="form-group">
                        <label for="email">メールアドレス</label>
                        <span id="email-error" class="error-message"></span>
                        <input type="email" id="email" placeholder="メールアドレスを入力してください。">
                    </div>
                    <div class="form-group">
                        <label for="password">パスワード</label>
                        <span id="password-error" class="error-message"></span>
                        <input type="password" id="password" placeholder="パスワードを入力してください。">
                    </div>
                    <div class="form-button">
                        <button type="submit">登録</button>
                        <button type="button" class="cancel">キャンセル</button>
                    </div>
                </form>
            </div>
        </main>

        <script src="../static/js/script.js"></script>
    </body>
</html>
