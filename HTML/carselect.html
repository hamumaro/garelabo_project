{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>GARELABO+｜車両選択</title>

        <link rel="icon" type="image/png" href="{% static 'assets/Garelabo_Logo.png' %}">
        <link rel="stylesheet" href="{% static 'css/List_style.css' %}">
        <link rel="stylesheet" href="{% static 'css/carselect_style.css' %}">
    </head>

    <body>
        <header class="header">
            <div class="header-inner">
                <div class="header-grid">
                    <div class="panel">
                        <img src="{% static 'assets/メーター.png' %}" alt="メーター">
                    </div>
                    <div class="panel">
                        <img src="{% static 'assets/R32.png' %}" alt="R32">
                    </div>
                    <div class="panel brand-area">
                        {% if user.is_authenticated %}
                            <a href="{% url 'account' %}" class="login-btn">アカウント</a>
                        {% else %}
                            <a href="{% url 'login' %}" class="login-btn">ログイン</a>
                        {% endif %}
                        <img class="garelabo-logo" src="{% static 'assets/garelabo_title.png' %}" alt="GARELABO+">
                    </div>
                </div>

                <nav class="ribbons" aria-label="メインメニュー">
                    <a class="ribbon" href="{% url 'custom_menu' %}">
                        <img src="{% static 'assets/カスタム作成.png' %}" alt="">
                        カスタム作成
                    </a>
                    <a class="ribbon" href="{% url 'list_page' %}">
                        <img src="{% static 'assets/一覧.png' %}" alt="">
                        一覧へ
                    </a>
                </nav>
            </div>
        </header>

        <div class="section-title">車両選択</div>

        <main class="content">
            <!-- ▼ 車両選択枠 -->
            <section class="car-select" aria-label="車両選択">
                <div class="car-display">
                    <button class="arrow-btn left" type="button" aria-label="前へ">&lt;</button>

                    <div class="car-frame" aria-live="polite">
                        <!-- JSで vehicles[0] を表示 -->
                        <img src="" alt="" class="car-image" id="carImage" hidden>
                        <div class="car-skeleton" id="carSkeleton">画像を読み込み中…</div>
                    </div>

                    <button class="arrow-btn right" type="button" aria-label="次へ">&gt;</button>
                </div>

                <p class="car-name">
                    <span id="carName">車名</span>
                </p>

                <!-- カスタムへ進む（car_id を付ける） -->
                <div class="car-actions">
                    <a class="select-btn" id="selectBtn" href="{% url 'custom_menu' %}">この車でカスタム</a>
                </div>
            </section>
        </main>

        <script>
            const vehicles = [
                {% for v in vehicles %}
                {
                    id: {{ v.id }},
                    name: "{{ v.name|escapejs }}",
                    image: "{% if v.base_image_path %}{{ v.base_image_path.url }}{% else %}{% static 'assets/noimage.png' %}{% endif %}"
                }{% if not forloop.last %},{% endif %}
                {% endfor %}
            ];
        </script>

        <script src="{% static 'js/carselect.js' %}"></script>
    </body>
</html>
