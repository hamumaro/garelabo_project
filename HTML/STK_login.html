<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" type="image/png" href="assets/Garelabo_Logo.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gare｜ログイン</title>
    <style>
        /* ベース */
        :root {
            --bg: #f5f5f7;
            --ink: #000000;
            --muted: #888;
            --panel: #fff;
            --line: #ddd;
            --brand: #000000;
            --link: #5b8ef1;
        }
        * { box-sizing: border-box; }
        html, body {
            height: 100%;
            margin: 0;
            font-family: "Noto Sans JP", system-ui, -apple-system, Segoe UI, Roboto, "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, sans-serif;
            color: var(--ink);
            background: var(--bg);
        }

        /* ヘッダー */
        .site-header {
            height: 150px;
            background: var(--brand);
            display: flex;
            align-items: center;
            padding: 0 24px;
        }
        .site-logo {
            height: 90px;
            width: auto;
            display: block;
            object-fit: contain;
            filter: none;
        }

        /* タイトル */
        .page-title {
            text-align: center;
            font-weight: 800;
            letter-spacing: 0.08em;
            font-size: clamp(28px, 3.6vw, 56px);
            margin: 48px 0 24px;
        }

        /* カード */
        .card {
            width: min(720px, 92vw);
            margin: 0 auto 80px;
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 40px 48px 28px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.03);
        }

        .form-row {
            margin: 28px 0 34px;
        }
        .label {
            display: block;
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        /* 下線のみの入力 */
        .underline-input {
            width: 100%;
            border: none;
            border-bottom: 2px solid #bdbdbd;
            background: transparent;
            padding: 10px 4px;
            font-size: 14px;
            outline: none;
            transition: border-color .2s ease;
        }
        .underline-input:focus {
            border-bottom-color: #000000;
        }
        .underline-input::placeholder {
            color: var(--muted);
        }

        /* ボタンとフッターリンク */
        .actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 8px;
        }
        .btn {
            appearance: none;
            border: none;
            background: #000000;
            color: #fff;
            padding: 10px 28px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity .15s ease, transform .02s ease;
        }
        .btn:active { transform: translateY(1px); }
        .register-link {
            margin-left: auto;
            font-size: 13px;
            color: var(--link);
            text-decoration: none;
        }
        .register-link:hover { text-decoration: underline; }

        /* レスポンシブ */
        @media (max-width: 520px) {
            .card { padding: 28px 20px 22px; }
            .actions { gap: 16px; }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <img class="site-logo" src="assets/ガレラボ+.png"  alt="GARELABO+">
    </header>

    <h1 class="page-title">ログイン</h1>

    <main class="card" role="main">
        <form action="#" method="post" novalidate>
            <div class="form-row">
                <label class="label" for="email">メールアドレス</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    class="underline-input"
                    placeholder="メールアドレスを入力してください。"
                    autocomplete="email"
                    required>
            </div>

            <div class="form-row">
                <label class="label" for="password">パスワード</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    class="underline-input"
                    placeholder="パスワードを入力してください。"
                    autocomplete="current-password"
                    required>
            </div>

            <div class="actions">
                <button class="btn" type="submit">ログイン</button>
                <a class="register-link" href="#">新規会員登録</a>
            </div>
        </form>
    </main>
</body>
</html>
