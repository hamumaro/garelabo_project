<!DOCTYPE html>
<html lang="ja">
<head>
    <link rel="icon" type="image/png" href="assets/Garelabo_Logo.png">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GARELABO+｜お気に入り一覧</title>
</head>
<body>

    <!-- ===== ヘッダー ===== -->
    <header class="hero">
        <div class="hero-grid">
            <!-- 左：メーター -->
            <div class="panel">
                <img src="assets/" alt="メーター">
            </div>

            <!-- 中央：リアビュー -->
            <div class="panel">
                <img src="assets/" alt="R33">
            </div>

            <!-- 右：ロゴブロック -->
            <div class="panel brand-area">
                <button class="login-btn">ログイン</button>
                <div class="brand-row">
                    <span class="palm" aria-hidden="true"></span>
                    <img class="logo" src="assets/" alt="GARELABO+">
                </div>
            </div>
        </div>

        <!-- 青いリボンメニュー -->
        <nav class="ribbons" aria-label="メインメニュー">
            <a class="ribbon" href="#build">
                <img src="assets/カスタム作成.png" alt="" width="35" height="35">
                カスタム作成
            </a>
            <a class="ribbon" href="#favorite">
                <span class="icon">🎬</span>
                一覧
            </a>
        </nav>
    </header>

    <!-- セクション見出し -->
    <div class="section-title">お気に入り一覧</div>

    <!-- コンテンツ -->
    <main class="content">
        <!-- ここにカードやリストを並べる -->
    </main>

</body>
</html>
