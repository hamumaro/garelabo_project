{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARELABO+｜カスタム中止確認</title>

    <link rel="icon" type="image/png" href="{% static 'assets/Garelabo_Logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/custom_caneled_style.css' %}">
</head>
<body>

    <!-- 黒ヘッダー -->
    <header class="top-header">
        <div class="top-header-inner">

            <!-- 左：GARELABOロゴ -->
            <div class="header-logo">
                <a href="{% url 'custom_menu' %}">
                    <img src="{% static 'assets/ガレラボ+.png' %}" alt="GARELABO+">
                </a>
            </div>

            <!-- 右：ユーザー名＋アイコン -->
            <div class="header-user">
                <span class="user-name">{{ user.nickname }}さん</span>
                <a href="{% url 'account' %}" class="user-icon">
                    <img src="{% static 'assets/アカウントアイコン.png' %}" alt="">
                </a>
            </div>

        </div>
    </header>

    <!-- メイン -->
    <main class="cancel-main">
        <h1 class="cancel-title">カスタムを中止しますか？</h1>

        <div class="cancel-buttons">
            <!-- YES：一覧へ -->
            <a href="{% url 'list_page' %}" class="cancel-btn">YES</a>

            <!-- NO：1つ前の画面に戻る -->
            <button
                type="button"
                id="cancel-no-btn"
                class="cancel-btn cancel-btn-no"
            >
                NO
            </button>
        </div>
    </main>

    <script>
        (function () {
            const btn = document.getElementById('cancel-no-btn');
            if (!btn) return;

            btn.addEventListener('click', function () {
                const ref = document.referrer;
                const sameOrigin = ref && ref.startsWith(location.origin);

                if (sameOrigin) {
                    // 同じサイト内なら直前のページに戻る
                    window.location.href = ref;
                } else if (window.history.length > 1) {
                    // それ以外は履歴戻し
                    window.history.back();
                } else {
                    // 直でこの画面を開かれたときの保険
                    window.location.href = "{% url 'list_page' %}";
                }
            });
        })();
    </script>

</body>
</html>
