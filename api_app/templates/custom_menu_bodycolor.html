{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="{% static 'assets/Garelabo_Logo.png' %}" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GARELABO+｜ボディカラー</title>
    <link rel="stylesheet" href="{% static 'css/custom_menu_bodycolor_style.css' %}?v=20260202_1" />

    <style>
      /* ✅ 白黒含むチップは基本「色だけ」優先 */
      #bodyPalette .garelabo-palette__chip {
        background: var(--c, #fff) !important;
        background-image: none !important;
      }

      /* 既存で ::before が何か描いてたら無効化 */
      #bodyPalette .garelabo-palette__chip::before {
        content: none !important;
      }
    </style>
  </head>

  <body>
    <header class="header">
      <div class="header-left">
        <img src="{% static 'assets/ガレラボ+.png' %}" class="logo" alt="GARELABO+" />
      </div>

      <nav class="header-nav">
        <a href="{% url 'auto_custom' %}" id="auto-custom-link" class="nav-btn">自動カスタム</a>

        <button
          id="favorite-toggle"
          type="button"
          class="nav-btn favorite-btn {% if is_favorite %}is-favorite{% endif %}"
        >
          {% if is_favorite %}✔ お気に入り{% else %}お気に入り{% endif %}
        </button>

        <a href="{% url 'custom_cancel' %}" class="nav-btn">カスタム中止</a>
      </nav>

      <div class="header-user">
        <span class="user-name">{{ user.nickname }}さん</span>
        <a href="{% url 'account' %}" class="user-icon">
          <img src="{% static 'assets/アカウントアイコン.png' %}" alt="アイコン" />
        </a>
      </div>
    </header>

    <button
      type="button"
      id="menu-open"
      class="menu-fab"
      aria-label="メニュー"
      aria-expanded="false"
    ></button>

    <div id="menu-hint" class="menu-tooltip" aria-hidden="true">メニューを表示</div>
    <div id="drawer-overlay" class="menu-overlay" aria-hidden="true"></div>

    <aside id="drawer" class="side-drawer" aria-hidden="true">
      <div class="drawer-header">
        <div class="drawer-title">カスタム項目</div>
        <button type="button" id="drawer-close" class="drawer-close">×</button>
      </div>

      <div class="drawer-body">
        <a href="{% url 'custom_menu_bodycolor' %}" class="drawer-item is-active">
          <span>ボディカラー</span><span class="arrow">›</span>
        </a>
        <a href="{% url 'custom_menu_wheel' %}" class="drawer-item">
          <span>ホイール</span><span class="arrow">›</span>
        </a>
        <a href="{% url 'custom_menu_bumper' %}" class="drawer-item">
          <span>バンパー</span><span class="arrow">›</span>
        </a>
        <a href="{% url 'custom_menu_aeroparts' %}" class="drawer-item">
          <span>エアロパーツ</span><span class="arrow">›</span>
        </a>
      </div>
    </aside>

    <main class="main-layout">
      <section class="car-display-area">
        <div class="car-frame">
          <img id="car-image" alt="car preview" loading="eager" />
        </div>

        <div class="rotate-hint">
          <button type="button" id="open-bodycolor" class="nav-btn">ボディカラー</button>
          <button type="button" id="prev-btn">←</button>
          <button type="button" id="next-btn">→</button>
        </div>

        <div class="color-palette-area">
          <div class="garelabo-palette-panel" id="bodycolor-panel" aria-hidden="true">
            <div class="garelabo-palette" id="bodyPalette">
              <button
                type="button"
                class="garelabo-palette__chip is-selected"
                style="--c:#e6e6e6;"
                data-color="white"
                aria-label="white"
              ></button>

              <button
                type="button"
                class="garelabo-palette__chip"
                style="--c:#111111;"
                data-color="black"
                aria-label="black"
              ></button>

              <button type="button" class="garelabo-palette__chip" style="--c:#f2c94c;" data-color="#f2c94c" aria-label="yellow"></button>
              <button type="button" class="garelabo-palette__chip" style="--c:#f2994a;" data-color="#f2994a" aria-label="orange"></button>
              <button type="button" class="garelabo-palette__chip" style="--c:#eb5757;" data-color="#eb5757" aria-label="red"></button>
              <button type="button" class="garelabo-palette__chip" style="--c:#2d9cdb;" data-color="#2d9cdb" aria-label="blue"></button>
              <button type="button" class="garelabo-palette__chip" style="--c:#27ae60;" data-color="#27ae60" aria-label="green"></button>
            </div>

            <input type="hidden" id="bodyColorValue" name="body_color" value="#e6e6e6" />
          </div>
        </div>

        <div class="save-area">
          <form action="{% url 'save_custom' %}" method="post">
            {% csrf_token %}

            <input
              type="hidden"
              name="is_favorite"
              id="is-favorite"
              value="{% if is_favorite %}true{% else %}false{% endif %}"
            />

            {% if current_custom_id %}
              <input type="hidden" name="custom_id" value="{{ current_custom_id }}">
            {% endif %}

            <button type="submit" class="save-custom-btn">カスタム内容保存</button>
          </form>
        </div>
      </section>
    </main>

    <div id="fullscreen-overlay" class="fullscreen-overlay" aria-hidden="true">
      <div class="fullscreen-actions">
        <button id="fullscreen-save" class="fullscreen-save" type="button">画像保存</button>
        <button id="fullscreen-close" class="fullscreen-close" type="button">×</button>
      </div>
      <img id="fullscreen-image" alt="fullscreen car" />
    </div>

      <!-- ✅ JSへ渡すサーバー値 -->
      <input type="hidden" id="current-vehicle-id" value="{{ vehicle.id }}">
      <input type="hidden" id="server-car-folder" value="{{ car_folder }}">
      <input type="hidden" id="server-color-folder" value="{{ current_color_folder }}">
      <input type="hidden" id="server-wheel-folder" value="{{ current_wheel_folder }}">
      <input type="hidden" id="server-bumper-folder" value="{{ current_bumper_folder }}">
      <input type="hidden" id="server-aero-folder" value="{{ current_aero_folder }}">


    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const autoLink = document.getElementById('auto-custom-link');
        const vehicleId = "{{ vehicle.id }}";
        
        // リンク先URLに現在の選択状態（セッションストレージ）を反映させる関数
        function syncAutoCustomLink() {
            if (!autoLink) return;
            const url = new URL(autoLink.href, window.location.origin);
            
            // 車両ID
            if (vehicleId) {
                url.searchParams.set('vehicle_id', vehicleId);
            }
            
            // セッションストレージから現在の選択状態を取得して反映
            // (currentColor, currentWheel, currentBumper)
            ['currentColor', 'currentWheel', 'currentBumper'].forEach(key => {
                const val = sessionStorage.getItem(key);
                if (val) {
                    // パラメータ名は color, wheel, bumper
                    url.searchParams.set(key.replace('current', '').toLowerCase(), val);
                }
            });
            autoLink.href = url.toString();
            // console.log("Link Updated:", autoLink.href);
        }

        // 初期化時に同期
        syncAutoCustomLink();

        // ユーザーがボタンをクリックした際にも同期（少し遅延させてsessionStorageへの保存を待つ）
        document.addEventListener('click', (e) => {
            // パレットチップ、ホイールボタン、バンパーボタン等が対象
            if (e.target.closest('.garelabo-palette__chip, .color-dot, .wheel-btn, .bumper-btn')) {
                setTimeout(syncAutoCustomLink, 100);
            }
        });
    });
    </script>

    <script src="{% static 'js/bodycolor.js' %}?v=20260202_1"></script>

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const palette = document.getElementById("bodyPalette");
        if (!palette) return;

        const chips = palette.querySelectorAll(".garelabo-palette__chip");
        if (!chips.length) return;

        function getFolderName(path) {
          if (!path) return "";
          return String(path).replace(/\\/g, "/").split("/").filter(Boolean).pop();
        }

        function applySelected(colorFolder) {
          chips.forEach((c) => {
            c.classList.toggle("is-selected", getFolderName(c.dataset.color) === colorFolder);
          });
        }

        // 初期反映（なければ white）
        const savedColor = getFolderName(sessionStorage.getItem("currentColor")) || "white";
        sessionStorage.setItem("currentColor", savedColor);
        applySelected(savedColor);

        // クリックで保存＆見た目更新
        chips.forEach((chip) => {
          chip.addEventListener("click", () => {
            const raw = chip.dataset.color;
            if (!raw) return;

            const colorFolder = getFolderName(raw) || "white";

            sessionStorage.setItem("currentColor", colorFolder);
            applySelected(colorFolder);

            // hidden更新も一応入れる（崩さないために残す）
            const hidden = document.getElementById("bodyColorValue");
            if (hidden) hidden.value = colorFolder;

            console.log("palette color selected:", colorFolder);
          });
        });
      });
    </script>
  </body>
</html>
