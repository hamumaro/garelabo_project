{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="{% static 'assets/Garelabo_Logo.png' %}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GARELABO+｜ボディカラー</title>
    <link
      rel="stylesheet"
      href="{% static 'css/custom_menu_bodycolor_style.css' %}"
    />
  </head>

  <body>
    <!-- ================= ヘッダー ================= -->
    <header class="header">
      <div class="header-left">
        <img
          src="{% static 'assets/ガレラボ+.png' %}"
          class="logo"
          alt="GARELABO+"
        />
      </div>

      <nav class="header-nav">
        {% comment %} {% if current_custom_id %}
          <a href="{% url 'auto_custom'%}" id="auto-custom-link" class="nav-btn">自動カスタム</a>
        {% else %}
          <a href="{% url 'auto_custom' %}" id="auto-custom-link" class="nav-btn">自動カスタム</a>
        {% endif %} {% endcomment %}
        <a href="{% url 'auto_custom' %}" id="auto-custom-link" class="nav-btn">自動カスタム</a>
        <button
          id="favorite-toggle"
          type="button"
          class="nav-btn favorite-btn {% if is_favorite %}is-favorite{% endif %}"
        >
          {% if is_favorite %}
            ✔ お気に入り
          {% else %}
            お気に入り
          {% endif %}
        </button>
        {% comment %} <a href="{% url 'estimate' %}" class="nav-btn">カスタム見積り</a> {% endcomment %}
        <a href="{% url 'custom_cancel' %}" class="nav-btn">カスタム中止</a>
      </nav>

      <div class="header-user">
        <span class="user-name">{{ user.nickname }}さん</span>
        <a href="{% url 'account' %}" class="user-icon">
          <img
            src="{% static 'assets/アカウントアイコン.png' %}"
            alt="アイコン"
          />
        </a>
      </div>
    </header>

    <main class="main-layout">
      <!-- ================= サイドメニュー ================= -->
      <aside class="side-menu">
        <a
          href="{% url 'custom_menu_bodycolor' %}"
          class="side-btn-link"
          style="background: #111; color: #fff"
        >
          ボディカラー
        </a>
        <a href="{% url 'custom_menu_wheel' %}" class="side-btn-link"
          >ホイール</a
        >
        <a href="{% url 'custom_menu_bumper' %}" class="side-btn-link"
          >バンパー</a
        >
        {% comment %}
        <a href="{% url 'custom_menu_light' %}" class="side-btn-link">ライト</a>
        <a href="{% url 'custom_menu_aeroparts' %}" class="side-btn-link">
          エアロパーツ
        </a>
        {% endcomment %}
      </aside>

      <!-- ================= メイン ================= -->
      <section class="car-display-area">
        <div class="car-frame">
          <!-- JSが画像を差し込む -->
          <img id="car-image" alt="car preview" />
        </div>

        <!-- 回転 -->
        <div class="rotate-hint">
          <button id="prev-btn">←</button>
          <button id="next-btn">→</button>
        </div>

        <!-- カラーパレット -->
        <div class="color-palette-area">
          <div class="color-row">
            <button class="color-dot" data-color="white">white</button>
            <button class="color-dot" data-color="black">black</button>
            <!-- 追加例 -->
            <!-- <button class="color-dot" data-color="red">red</button> -->
          </div>
        </div>

        <!-- 保存 -->
        <div class="save-area">
        <form action="{% url 'save_custom' %}" method="post">
          {% csrf_token %}

          <input
            type="hidden"
            name="is_favorite"
            id="is-favorite"
            value="{% if is_favorite %}true{% else %}false{% endif %}"
          >

          <button type="submit" class="save-custom-btn">
            カスタム内容保存
          </button>
        </form>
        </div>

        <!-- JS -->
        <script src="{% static 'js/bodycolor.js' %}"></script>
      </section>
    </main>
  </body>

  <!-- 自動カスタムリンクに現在の選択状態を反映させる -->
  <input type="hidden" id="current-vehicle-id" value="{{ vehicle.id }}">

<script>
document.addEventListener('DOMContentLoaded', function() {
    const colorBtns = document.querySelectorAll('.color-dot');
    const autoLink = document.getElementById('auto-custom-link');
    // 埋め込んだ車両IDを取得
    const currentVehicleId = document.getElementById('current-vehicle-id').value;
    
    if (!autoLink) return;

    // 1. ページ読み込み時に、まず車両IDをリンクにセットする
    //    (これをしないと、色を変えずにすぐボタンを押した場合に前の車のままになります)
    if (currentVehicleId) {
        const url = new URL(autoLink.href, window.location.origin);
        url.searchParams.set('vehicle_id', currentVehicleId);
        
        // 現在URLに色の指定があればそれも引き継ぐ（戻るボタン対策）
        const currentParams = new URLSearchParams(window.location.search);
        const urlColor = currentParams.get('color');
        if(urlColor) {
             url.searchParams.set('color', urlColor);
        }
        
        autoLink.href = url.toString();
    }

    // 2. 色ボタンを押したときの処理
    colorBtns.forEach(btn => {
        btn.addEventListener('click', function() {
            const colorFolder = this.getAttribute('data-color');
            if (colorFolder) {
                // 現在のリンクURLを取得（ここには既に vehicle_id が入っているはず）
                const url = new URL(autoLink.href, window.location.origin);
                
                // 色情報を上書き
                url.searchParams.set('color', colorFolder);
                
                // 念のため車両IDが消えていないか確認し、なければ再セット
                if (currentVehicleId && !url.searchParams.has('vehicle_id')) {
                    url.searchParams.set('vehicle_id', currentVehicleId);
                }

                autoLink.href = url.toString();
                // console.log("Link updated:", autoLink.href); // 確認用
            }
        });
    });
});
</script>
</html>
