{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{% static 'assets/Garelabo_Logo.png' %}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARELABO+｜ボディカラー</title>
    <link rel="stylesheet" href="{% static 'css/custom_menu_bodycolor_style.css' %}">
</head>
<body>

<header class="header">
    <div class="header-left">
        <img src="{% static 'assets/ガレラボ+.png' %}" class="logo" alt="GARELABO+">
    </div>

    <nav class="header-nav">
        <a href="{% url 'auto_custom' %}" class="nav-btn">自動カスタム</a>
        <a href="{% url 'favorite_page' %}" class="nav-btn">お気に入り</a>
        <a href="{% url 'estimate' %}" class="nav-btn">カスタム見積り</a>
        <a href="{% url 'custom_cancel' %}" class="nav-btn">カスタム中止</a>
    </nav>

    <div class="header-user">
        <span class="user-name">{{ user.nickname }}さん</span>
        <a href="{% url 'account' %}" class="user-icon">
            <img src="{% static 'assets/アカウントアイコン.png' %}" alt="アイコン">
        </a>
    </div>
</header>

<main class="main-layout">

    <!-- ▼ サイドメニュー -->
    <aside class="side-menu">

        <div class="day-night-switch">
            <button class="day-night-toggle" type="button">
                <span class="icon sun">☀</span>
                <span class="icon moon">🌙</span>
            </button>
        </div>

        <!-- ★ ボディカラーページなので確定で黒（インラインCSS） -->
        <a href="{% url 'custom_menu_bodycolor' %}"class="side-btn-link"style="background:#111; color:#fff;">ボディカラー</a>
        <a href="{% url 'custom_menu_wheel' %}" class="side-btn-link">ホイール</a>
        <a href="{% url 'custom_menu_bumper' %}" class="side-btn-link">バンパー</a>
        <a href="{% url 'custom_menu_light' %}" class="side-btn-link">ライト</a>
        <a href="{% url 'custom_menu_aeroparts' %}" class="side-btn-link">エアロパーツ</a>

    </aside>

    <!-- ▼ 車・カラー・保存ボタン -->
    <section class="car-display-area">

        <div class="car-frame">
                <!-- DB画像 -->
                <img src="{% static 'assets/r34_sample.png' %}" class="car-image" alt="車">
            </div>

        <div class="rotate-hint">
        <button id="prev-btn">←</button>
        <button id="next-btn">→</button>
        <span>360°</span>
        </div>

        <div class="color-palette-area">
            <div class="color-row">
                <button class="color-dot" data-color="#0a33f5"></button>
                <button class="color-dot" data-color="#ffffff"></button>
                <button class="color-dot" data-color="#000000"></button>
                <button class="color-dot" data-color="#d11c1c"></button>
            </div>
        </div>

        <div class="save-area">
            <form action="{% url 'save_custom' %}" method="post">
                {% csrf_token %}
                <button type="submit" class="save-custom-btn">
                カスタム内容保存
                </button>
            </form>
        </div>


    </section>

</main>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const dots = document.querySelectorAll('.color-dot');
    const frame = document.querySelector('.car-frame');

    dots.forEach(btn => {
        btn.addEventListener('click', () => {
            dots.forEach(b => b.classList.remove('is-selected'));
            btn.classList.add('is-selected');
            frame.style.backgroundColor = btn.dataset.color;
        });
    });
});
</script>

</body>
</html>
