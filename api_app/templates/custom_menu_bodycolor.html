{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="{% static 'assets/Garelabo_Logo.png' %}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GARELABO+｜ボディカラー</title>
    <link
      rel="stylesheet"
      href="{% static 'css/custom_menu_bodycolor_style.css' %}"
    />
  </head>

  <body>
    <header class="header">
      <div class="header-left">
        <img
          src="{% static 'assets/ガレラボ+.png' %}"
          class="logo"
          alt="GARELABO+"
        />
      </div>

      <nav class="header-nav">
        <a href="{% url 'auto_custom' %}" id="auto-custom-link" class="nav-btn">自動カスタム</a>
        <button
          id="favorite-toggle"
          type="button"
          class="nav-btn favorite-btn {% if is_favorite %}is-favorite{% endif %}"
        >
          {% if is_favorite %}
            ✔ お気に入り
          {% else %}
            お気に入り
          {% endif %}
        </button>
        {% comment %} <a href="{% url 'estimate' %}" class="nav-btn">カスタム見積り</a> {% endcomment %}
        <a href="{% url 'custom_cancel' %}" class="nav-btn">カスタム中止</a>
      </nav>

      <div class="header-user">
        <span class="user-name">{{ user.nickname }}さん</span>
        <a href="{% url 'account' %}" class="user-icon">
          <img
            src="{% static 'assets/アカウントアイコン.png' %}"
            alt="アイコン"
          />
        </a>
      </div>
    </header>

    <main class="main-layout">
      <aside class="side-menu">
        <a
          href="{% url 'custom_menu_bodycolor' %}"
          class="side-btn-link"
          style="background: #111; color: #fff"
        >
          ボディカラー
        </a>
        <a href="{% url 'custom_menu_wheel' %}" class="side-btn-link"
          >ホイール</a
        >
        <a href="{% url 'custom_menu_bumper' %}" class="side-btn-link"
          >バンパー</a
        >
      </aside>

      <section class="car-display-area">
        <div class="car-frame">
          <img id="car-image" alt="car preview" />
        </div>

        <div class="rotate-hint">
          <button id="prev-btn">←</button>
          <button id="next-btn">→</button>
        </div>

        <div class="color-palette-area">
          <div class="color-row">
            {% for color in colors %}
              <button class="color-dot" data-color="{{ color.rotation_image_folder }}">
                {{ color.name }}
              </button>
            {% empty %}
              <button class="color-dot" data-color="white">white</button>
              <button class="color-dot" data-color="black">black</button>
            {% endfor %}
          </div>
        </div>

        <div class="save-area">
        <form action="{% url 'save_custom' %}" method="post">
          {% csrf_token %}

          <input
            type="hidden"
            name="is_favorite"
            id="is-favorite"
            value="{% if is_favorite %}true{% else %}false{% endif %}"
          >

          <button type="submit" class="save-custom-btn">
            カスタム内容保存
          </button>
        </form>
        </div>
        
        <input type="hidden" id="current-vehicle-id" value="{{ vehicle.id }}">
        <input type="hidden" id="server-car-folder" value="{{ car_folder }}">
        <input type="hidden" id="server-color-folder" value="{{ current_color_folder }}">
        <input type="hidden" id="server-wheel-folder" value="{{ current_wheel_folder }}">
        <input type="hidden" id="server-bumper-folder" value="{{ current_bumper_folder }}">


        <script src="{% static 'js/bodycolor.js' %}"></script>
        
        <script>
        document.addEventListener('DOMContentLoaded', function() {
            const autoLink = document.getElementById('auto-custom-link');
            const currentVehicleIdInput = document.getElementById('current-vehicle-id');
            const currentVehicleId = currentVehicleIdInput ? currentVehicleIdInput.value : null;
            
            if (!autoLink) return;

            // リンク更新関数: sessionStorage から最新情報を取得してURLパラメータをセット
            function updateAutoCustomLink() {
                const url = new URL(autoLink.href, window.location.origin);
                
                // 1. 車両ID
                if (currentVehicleId) {
                    url.searchParams.set('vehicle_id', currentVehicleId);
                }

                // 2. ブラウザの記憶(sessionStorage)から最新値を取得
                const sColor = sessionStorage.getItem('currentColor');
                const sWheel = sessionStorage.getItem('currentWheel');
                const sBumper = sessionStorage.getItem('currentBumper');

                if (sColor) url.searchParams.set('color', sColor);
                if (sWheel) url.searchParams.set('wheel', sWheel);
                if (sBumper) url.searchParams.set('bumper', sBumper);

                autoLink.href = url.toString();
            }

            // 初期化時に実行
            updateAutoCustomLink();

            // 各ボタンクリック時にも少し待ってから更新 (sessionStorageへの保存待ち)
            const allBtns = document.querySelectorAll('.bumper-btn, .wheel-btn, .color-dot');
            allBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                     setTimeout(updateAutoCustomLink, 50);
                });
            });
        });
        </script>
      </section>
    </main>
  </body>
</html>
