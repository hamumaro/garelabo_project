{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      type="image/png"
      href="{% static 'assets/Garelabo_Logo.png'%}"
    />
    <title>GARELABO+｜カスタムメニュー</title>
    <link rel="stylesheet" href="{% static 'css/custom_menu_style.css'%}" />
  </head>
  <body>
    <!-- ▼ ヘッダー -->
    <header class="header">
      <div class="header-left">
        <img
          src="../static/assets/ガレラボ+.png"
          class="logo"
          alt="GARELABO+"
        />
      </div>

      <nav class="header-nav">
        <a href="/custom/auto" class="nav-btn">自動カスタム</a>
        <a href="favorite_List.html" class="nav-btn">お気に入り</a>
        <a href="estimate.html" class="nav-btn">カスタム見積り</a>
        <a href="custom_cancel.html" class="nav-btn">カスタム中止</a>
      </nav>

      <div class="header-user">
        <span class="user-name">{{ user_name }}さん</span>
        <a href="/account" class="user-icon">
          <img src="../static/assets/アカウントアイコン.png" alt="" />
          <!-- データベース使用時: src="{{ user_icon_url }}" -->
        </a>
      </div>
    </header>

    <!-- ▼ メインレイアウト -->
    <main class="main-layout">
      <!-- 左のタブ（リンク化済み） -->
      <aside class="side-menu">
        <!-- 昼夜切替：画像じゃなくボタン風 -->
        <div class="day-night-switch">
          <button class="day-night-toggle" type="button">
            <span class="icon sun">☀</span>
            <span class="icon moon">🌙</span>
          </button>
        </div>

        <a href="#" class="side-btn-link">ボディカラー</a>
        <a href="#" class="side-btn-link">ホイール</a>
        <a href="#" class="side-btn-link">バンパー</a>
        <a href="#" class="side-btn-link">ライト</a>
        <a href="#" class="side-btn-link">エアロパーツ</a>
      </aside>

      <!-- ▼ 車の枠（DB画像をここに入れる） -->
      <section class="car-display-area">
        <div class="car-frame">
          <img
            id="car-image"
            src="{{vehicles.0.base_image_path.url }}"
            alt="{{ vehicles.0.name }}"
          />
        </div>

        <div class="rotate-hint">
          <button id="prev-btn">←</button>
          <button id="next-btn">→</button>
        </div>

        <!-- JSON データを埋め込む -->
        <script id="vehicles-data" type="application/json">
          [
              {% for v in vehicles%}
              { "url": "{{ v.base_image_path.url }}", "name": "{{ v.name }}" }{% if not forloop.last %},{% endif %}
              {% endfor %}
          ]
        </script>

        <!-- 外部JS読み込み -->
        <script src="{% static 'js/custom_slider.js' %}"></script>
      </section>
    </main>
  </body>
</html>
