{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <link rel="icon" type="image/png" href="{% static 'assets/Garelabo_Logo.png' %}" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GARELABO+｜カスタムメニュー</title>
    <link rel="stylesheet" href="{% static 'css/custom_menu_style.css' %}" />
  </head>

  <body>
    <!-- ===== ヘッダー ===== -->
    <header class="header">
      <div class="header-left">
        <img src="{% static 'assets/ガレラボ+.png' %}" class="logo" alt="GARELABO+" />
      </div>

      <nav class="header-nav">
        <a href="{% url 'auto_custom' vehicle.id %}" class="nav-btn">自動カスタム</a>
        <a href="{% url 'favorite_page' %}" class="nav-btn">お気に入り</a>
        <a href="{% url 'estimate' %}" class="nav-btn">カスタム見積り</a>
        <a href="{% url 'custom_cancel' %}" class="nav-btn">カスタム中止</a>
      </nav>

      <div class="header-user">
        <span class="username">{{ user.nickname }} さん</span>
        <a href="{% url 'account' %}" class="user-icon">
          <img src="{% static 'assets/アカウントアイコン.png' %}" alt="" />
        </a>
      </div>
    </header>

    <!-- ===== メイン ===== -->
    <main class="main-layout">

      <!-- ===== サイドメニュー（開閉式） ===== -->
      <aside class="side-menu">

        <!-- トグル -->
        <button
          type="button"
          id="exterior-toggle"
          class="side-tab"
          aria-expanded="false"
        >
          エクステリア
        </button>

        <!-- 折りたたみエリア（初期は閉じる） -->
        <div
          id="exterior-menu"
          class="side-section"
          aria-hidden="true"
        >
          <a href="{% url 'custom_menu_bodycolor' %}" class="side-item">
            <span>ボディカラー</span>
            <span class="arrow">›</span>
          </a>

          <a href="{% url 'custom_menu_wheel' %}" class="side-item">
            <span>ホイール</span>
            <span class="arrow">›</span>
          </a>

          <a href="{% url 'custom_menu_bumper' %}" class="side-item">
            <span>バンパー</span>
            <span class="arrow">›</span>
          </a>

          <a href="{% url 'custom_menu_light' %}" class="side-item">
            <span>ライト</span>
            <span class="arrow">›</span>
          </a>

          <a href="{% url 'custom_menu_aeroparts' %}" class="side-item">
            <span>エアロパーツ</span>
            <span class="arrow">›</span>
          </a>
        </div>
      </aside>

      <!-- ===== 車表示エリア ===== -->
      <section class="car-display-area">
        <div class="car-frame">
          <img
            id="car-image"
            src="{{ vehicles.0.base_image_path.url }}"
            alt="{{ vehicles.0.name }}"
          />
        </div>

        <div class="rotate-hint">
          <button id="prev-btn">←</button>
          <button id="next-btn">→</button>
          360°
        </div>

        <script id="vehicles-data" type="application/json">
          [
            {% for v in vehicles %}
            {
              "id": "{{ v.id }}",
              "url": "{{ v.base_image_path.url }}",
              "name": "{{ v.name }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
          ]
        </script>

        <script src="{% static 'js/custom_slider.js' %}"></script>
      </section>
    </main>

    <!-- ===== 表示・非表示制御（確実に動く位置） ===== -->
    <script>
      const toggleBtn = document.getElementById("exterior-toggle");
      const menu = document.getElementById("exterior-menu");

      if (toggleBtn && menu) {
        toggleBtn.addEventListener("click", () => {
          const isOpen = menu.classList.toggle("open");
          toggleBtn.setAttribute("aria-expanded", isOpen);
          menu.setAttribute("aria-hidden", !isOpen);
        });
      } else {
        console.error("side menu toggle elements not found");
      }
    </script>
  </body>
</html>
