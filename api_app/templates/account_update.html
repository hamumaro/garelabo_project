{% load static %}
<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>GARELABO+｜アカウント編集</title>
        <link rel="icon" type="image/png" href="{% static 'assets/Garelabo_Logo.png' %}">
        <link rel="stylesheet" href="{% static 'css/account_style.css' %}">
    </head>
    <body>

        <header class="header">
            <div class="header-logo">
                <a href="{% url 'list_page' %}">
                    <img src="{% static 'assets/ガレラボ+.png' %}" alt="GARELABO+" class="logo-img">
                </a>
            </div>
            <div class="header-user">
                <span class="user-name">{{user.nickname }}さん</span>
                <img src="{% static 'assets/アカウントアイコン.png' %}" alt="ユーザーアイコン" class="user-icon">
            </div>
        </header>

        {% if messages %}
        <div class="django-messages">
            {% for message in messages %}
                <p class="message {{ message.tags }}">{{ message }}</p>
            {% endfor %}
        </div>
        {% endif %}

        <main class="container">
            　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　　<!--アカウントセーブがない-->
            <form class="profile-form" id="registerForm" method="post" action="">
            <form class="profile-form" id="registerForm" method="post" action="{% url 'account_save' %}" novalidate>
                {% csrf_token %}

                <div class="form-group">
                    <label for="nickname">ニックネーム</label>
                    <span id="nickname-error" class="error" style="display:block; color:red;"></span>
                    <input type="text" id="nickname" name="nickname" value="{{ nickname }}">                        
                </div>

                <div class="form-group">
                    <label for="email">メールアドレス</label>
                    <span id="email-error" class="error" style="display:block; color:red;"></span>
                    <input type="email" id="email" name="email" value="{{ email }}">
                </div>

                <div class="form-group">
                    <label for="password">パスワード</label>
                    <span id="password-error" class="error" style="display:block; color:red;"></span>
                    <input type="password" id="password" name="password" value="{{ password }}">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-save">保存</button>
                    <a href="{% url 'account' %}" class="btn btn-back">戻る</a>
                </div>
            </form>
        </main>

        <script src="{% static 'js/account_error.js' %}"></script>
    </body>
</html>
