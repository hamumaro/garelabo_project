{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GARELABO+｜車両選択</title>

    <link
      rel="icon"
      type="image/png"
      href="{% static 'assets/Garelabo_Logo.png' %}"
    />
    <link rel="stylesheet" href="{% static 'css/List_style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/car_select_style.css' %}" />
  </head>

  <body>
    <header class="header">
      <div class="header-inner">
        <div class="header-grid">
          <div class="panel">
            <img src="{% static 'assets/メーター.png' %}" />
          </div>
          <div class="panel">
            <img src="{% static 'assets/R32.png' %}" />
          </div>

          <div class="brand-area">
            {% if user.is_authenticated %}
            <div class="user-info">
              <span class="username">{{ user.nickname }} さん</span>
              <a href="{% url 'account' %}">
                <img
                  src="{% static 'assets/アカウントアイコン.png' %}"
                  class="user-icon"
                />
              </a>
            </div>
            {% endif %}
            <img
              class="garelabo-logo"
              src="{% static 'assets/garelabo_title.png' %}"
            />
          </div>
        </div>

        <nav class="ribbons">
          <a class="ribbon" href="#" onclick="goToBodyColor(event)">
            <img src="{% static 'assets/カスタム作成.png' %}" />
            カスタム作成
          </a>
        </nav>
      </div>
    </header>

    <div class="section-title">車両選択</div>

    <main class="content">
      <section class="car-display-area">
        <div class="car-display">
          <button class="arrow-btn" id="prev-btn">＜</button>

          <div class="car-frame">
            <img
              id="carImage"
              src="{{ vehicles.0.base_image_path.url }}"
              alt="{{ vehicles.0.name }}"
              class="car-image"
            />
          </div>

          <button class="arrow-btn" id="next-btn">＞</button>
        </div>

        <h2 class="car-name" id="carName">{{ vehicles.0.name }}</h2>

        <!-- ★ フォルダ用キーを保持 -->
        <input
          type="hidden"
          id="selectedCarKey"
          value="{{ vehicles.0.car_key }}"
        />

        <!-- JS用データ -->
        <script id="vehicles-data" type="application/json">
          [
            {% for v in vehicles %}
            {
              "url": "{{ v.base_image_path.url }}",
              "name": "{{ v.name }}",
              "car_key": "{{ v.car_key }}"
            }{% if not forloop.last %},{% endif %}
            {% endfor %}
          ]
        </script>

        <script src="{% static 'js/car_select.js' %}"></script>

        <script>
          function goToBodyColor(e) {
            e.preventDefault();

            //const carKey = document.getElementById("selectedCarKey").value;
            //if (!carKey) return;

            // ★ 直でカラー画面へ
            window.location.href =
              "{% url 'custom_menu_bodycolor' %}?car=Rocky"; //+ carKey;
          }
        </script>
      </section>
    </main>
  </body>
</html>
