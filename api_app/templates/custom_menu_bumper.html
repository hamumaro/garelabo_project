{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="{% static 'assets/Garelabo_Logo.png' %}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GARELABO+｜バンパー</title>
    <link
      rel="stylesheet"
      href="{% static 'css/custom_menu_bumper_style.css' %}"
    />
  </head>

  <body>
    <header class="header">
      <div class="header-left">
        <img
          src="{% static 'assets/ガレラボ+.png' %}"
          class="logo"
          alt="GARELABO+"
        />
      </div>

      <nav class="header-nav">
        <a href="{% url 'auto_custom' %}" id="auto-custom-link" class="nav-btn">自動カスタム</a>
        <button
          id="favorite-toggle"
          type="button"
          class="nav-btn favorite-btn {% if is_favorite %}is-favorite{% endif %}"
        >
          {% if is_favorite %}
            ✔ お気に入り
          {% else %}
            お気に入り
          {% endif %}
        </button>
        {% comment %} <a href="{% url 'estimate' %}" class="nav-btn">カスタム見積り</a> {% endcomment %}
        <a href="{% url 'custom_cancel' %}" class="nav-btn">カスタム中止</a>
      </nav>

      <div class="header-user">
        <span class="user-name">{{ user.nickname }}さん</span>
        <a href="{% url 'account' %}" class="user-icon">
          <img
            src="{% static 'assets/アカウントアイコン.png' %}"
            alt="アイコン"
          />
        </a>
      </div>
    </header>

    <main class="main-layout">
      <aside class="side-menu">
        <a href="{% url 'custom_menu_bodycolor' %}" class="side-btn-link">
          ボディカラー
        </a>
        <a href="{% url 'custom_menu_wheel' %}" class="side-btn-link">
          ホイール
        </a>
        <a
          href="{% url 'custom_menu_bumper' %}"
          class="side-btn-link"
          style="background: #111; color: #fff"
        >
          バンパー
        </a>
      </aside>

      <section class="car-display-area">
        <div class="car-frame">
          <img id="car-image" alt="bumper preview" />
        </div>

        <div class="rotate-hint">
          <button id="prev-btn">←</button>
          <button id="next-btn">→</button>
        </div>

        <div class="bumper-palette-area">
          <div class="bumper-row">
            {% for bumper in bumpers %}
              <button class="bumper-btn" data-bumper="{{ bumper.image_url }}">
                {{ bumper.name }}
              </button>
            {% empty %}
              <p>バンパーが見つかりません</p>
            {% endfor %}
          </div>
        </div>

        <div class="save-area">
          <form action="{% url 'save_custom' %}" method="post">
            {% csrf_token %}
  
            <input
                type="hidden"
                name="is_favorite"
                id="is-favorite"
                value="{% if is_favorite %}true{% else %}false{% endif %}"
            >

            <button type="submit" class="save-custom-btn">
              カスタム内容保存
            </button>
          </form>
        </div>

        <script src="{% static 'js/bumper.js' %}"></script>
      </section>
    </main>
  </body>
  
  <input type="hidden" id="current-vehicle-id" value="{{ vehicle.id }}">

<script>
document.addEventListener('DOMContentLoaded', function() {
    // ★修正: クラス名を .bumper-btn に合わせました
    const btns = document.querySelectorAll('.bumper-btn'); 
    const link = document.getElementById('auto-custom-link');
    const currentVehicleIdInput = document.getElementById('current-vehicle-id');
    const currentVehicleId = currentVehicleIdInput ? currentVehicleIdInput.value : null;
    
    if (!link) return;

    // ヘルパー関数: パスからフォルダ名だけを取り出す
    function getFolderName(path) {
        if (!path) return "";
        return path.replace(/\\/g, '/').split('/').pop();
    }

    // ★追加: ページ読み込み時に車両IDをリンクにセットする
    if (currentVehicleId) {
        const currentUrl = new URL(link.href, window.location.origin);
        currentUrl.searchParams.set('vehicle_id', currentVehicleId);
        link.href = currentUrl.toString();
    }

    btns.forEach(btn => {
        btn.addEventListener('click', function() {
            // ★修正: 属性名を data-bumper に合わせました
            const rawPath = this.getAttribute('data-bumper');
            
            if (rawPath) {
                // ここでもフォルダ名だけにする（URLをきれいにするため）
                const folder = getFolderName(rawPath);

                const url = new URL(link.href, window.location.origin);
                url.searchParams.set('bumper', folder);
                
                // 車両IDの再確認
                if (currentVehicleId && !url.searchParams.has('vehicle_id')) {
                    url.searchParams.set('vehicle_id', currentVehicleId);
                }

                link.href = url.toString();
            }
        });
    });
});
</script>
</html>
