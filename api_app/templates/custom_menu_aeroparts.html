{% load static %}
<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/png"
      href="{% static 'assets/Garelabo_Logo.png' %}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GARELABO+｜エアロパーツ</title>
    <link
      rel="stylesheet"
      href="{% static 'css/custom_menu_aeroparts_style.css' %}"
    />
  </head>

  <body>
    <header class="header">
      <div class="header-left">
        <img
          src="{% static 'assets/ガレラボ+.png' %}"
          class="logo"
          alt="GARELABO+"
        />
      </div>

      <nav class="header-nav">
        <a href="{% url 'auto_custom' %}" id="auto-custom-link" class="nav-btn">自動カスタム</a>
        
        <button
          id="favorite-toggle"
          type="button"
          class="nav-btn favorite-btn {% if is_favorite %}is-favorite{% endif %}"
        >
          {% if is_favorite %}
            ✔ お気に入り
          {% else %}
            お気に入り
          {% endif %}
        </button>
        
        <a href="{% url 'custom_cancel' %}" class="nav-btn">カスタム中止</a>
      </nav>

      <div class="header-user">
        <span class="user-name">{{ user.nickname }}さん</span>
        <a href="{% url 'account' %}" class="user-icon">
          <img
            src="{% static 'assets/アカウントアイコン.png' %}"
            alt="アイコン"
          />
        </a>
      </div>
    </header>

    <button
      type="button"
      id="menu-open"
      class="menu-fab"
      aria-label="メニュー"
      aria-expanded="false"
    ></button>

    <div id="menu-hint" class="menu-tooltip" aria-hidden="true">メニューを表示</div>
    
    <div id="drawer-overlay" class="menu-overlay" aria-hidden="true"></div>

    <aside id="drawer" class="side-drawer" aria-hidden="true">
      <div class="drawer-header">
        <span class="drawer-title">カスタム項目</span>
        <button type="button" id="drawer-close" class="drawer-close">×</button>
      </div>
      
      <div class="drawer-body">
        <a href="{% url 'custom_menu_bodycolor' %}" class="drawer-item">
          <span>ボディカラー</span><span class="arrow">›</span>
        </a>
        <a href="{% url 'custom_menu_wheel' %}" class="drawer-item">
          <span>ホイール</span><span class="arrow">›</span>
        </a>
        <a href="{% url 'custom_menu_bumper' %}" class="drawer-item">
          <span>バンパー</span><span class="arrow">›</span>
        </a>
        <a href="{% url 'custom_menu_aeroparts' %}" class="drawer-item is-active">
          <span>エアロパーツ</span><span class="arrow">›</span>
        </a>
      </div>
    </aside>

    <main class="main-layout">
      <section class="car-display-area">
        <div class="car-frame">
          <img id="car-image" alt="aero preview" loading="eager" />
        </div>

        <div class="rotate-hint">
          <button type="button" id="open-aero" class="nav-btn">エアロ</button>
          <button type="button" id="prev-btn">←</button>
          <button type="button" id="next-btn">→</button>
        </div>

        <div class="aero-palette-area">
          <div class="garelabo-palette-panel" id="aero-panel" aria-hidden="true">
            <div class="aero-row">
              {% for aero in aeros %}
                <button class="aero-btn" data-aero="{{ aero.image_url }}">
                  {{ aero.name }}
                </button>
              {% empty %}
                <button type="button" class="aero-btn" data-aero="aero1">Aero 1</button>
              {% endfor %}
            </div>
            <input type="hidden" id="aeroValue" name="aero_parts" value="">
          </div>
        </div>

        <div class="save-area">
          <form action="{% url 'save_custom' %}" method="post">
            {% csrf_token %}
  
            <input
                type="hidden"
                name="is_favorite"
                id="is-favorite"
                value="{% if is_favorite %}true{% else %}false{% endif %}"
            >
            
            {% if current_custom_id %}
              <input type="hidden" name="custom_id" value="{{ current_custom_id }}">
            {% endif %}

            <button type="submit" class="save-custom-btn">
              カスタム内容保存
            </button>
          </form>
        </div>
      </section>
    </main>

    <div id="fullscreen-overlay" class="fullscreen-overlay" aria-hidden="true">
        <div class="fullscreen-actions">
            <button id="fullscreen-save" class="fullscreen-save" type="button">画像保存</button>
            <button id="fullscreen-close" class="fullscreen-close" type="button">×</button>
        </div>
        <img id="fullscreen-image" alt="Fullscreen Preview">
    </div>

    <input type="hidden" id="current-vehicle-id" value="{{ vehicle.id }}">
    <input type="hidden" id="server-car-folder" value="{{ car_folder }}">
    <input type="hidden" id="server-color-folder" value="{{ current_color_folder }}">
    <input type="hidden" id="server-wheel-folder" value="{{ current_wheel_folder }}">
    <input type="hidden" id="server-bumper-folder" value="{{ current_bumper_folder }}">
    <input type="hidden" id="server-aero-folder" value="{{ current_aero_folder }}">

    <script src="{% static 'js/aeroparts.js' %}"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        const autoLink = document.getElementById('auto-custom-link');
        const currentVehicleIdInput = document.getElementById('current-vehicle-id');
        const currentVehicleId = currentVehicleIdInput ? currentVehicleIdInput.value : null;
        
        if (!autoLink) return;

        function updateAutoCustomLink() {
            const url = new URL(autoLink.href, window.location.origin);
            
            if (currentVehicleId) {
                url.searchParams.set('vehicle_id', currentVehicleId);
            }

            const sColor = sessionStorage.getItem('currentColor');
            const sWheel = sessionStorage.getItem('currentWheel');
            const sBumper = sessionStorage.getItem('currentBumper');
            const sAero = sessionStorage.getItem('currentAero'); 

            if (sColor) url.searchParams.set('color', sColor);
            if (sWheel) url.searchParams.set('wheel', sWheel);
            if (sBumper) url.searchParams.set('bumper', sBumper);
            if (sAero) url.searchParams.set('aero', sAero);

            autoLink.href = url.toString();
        }

        updateAutoCustomLink();

        const allBtns = document.querySelectorAll('.aero-btn, .bumper-btn, .wheel-btn, .color-dot');
        allBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                 setTimeout(updateAutoCustomLink, 50);
            });
        });
    });
    </script>
  </body>
</html>
