{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GARELABO+｜アカウント</title>

    <!-- Django 静的ファイル -->
    <link rel="icon" type="image/png" href="{% static 'assets/Garelabo_Logo.png' %}">
    <link rel="stylesheet" href="{% static 'css/account_style.css' %}?v=20260130_1">
</head>

<body>

    <header class="header">

        <!-- 左ロゴ -->
        <div class="header-logo">
            <a href="{% url 'list_page' %}">
                    <img src="{% static 'assets/ガレラボ+.png' %}" alt="GARELABO+" class="logo-img">
                </a>
        </div>
        <div class="header-grid">
            <div class="panel">
                        <img src="{% static 'assets/R35風.png' %}" alt="R35">
                    </div>
        </div>

        <!-- 右上ユーザー情報 -->
        <div class="header-user">
            <span class="user-name">{{ user.nickname }}さん</span>
            <div class="user-icon">
                <img src="{% static 'assets/アカウントアイコン.png' %}" alt="ユーザーアイコン">
            </div>
        </div>

    </header>

    <main class="container">
        <form class="profile-form" method="post">
            {% csrf_token %}

            <div class="form-group">
                <label for="nickname">ニックネーム</label>
                <input type="text" id="nickname" value="{{ user.nickname }}" readonly>
            </div>

            <div class="form-group">
                <label for="email">メールアドレス</label>
                <input type="text" id="email" value="{{ user.email }}" readonly>
            </div>

            <div class="form-group">
                <label for="password">パスワード</label>
                <input type="password" id="password" value="{{ user.password }}" readonly>
            </div>

    <div class="form-actions">

    <!-- アカウント変更画面へ -->
    <a href="{% url 'account_update' %}" class="btn btn-change">変更</a>

    <!-- 戻るボタン（scriptで制御） -->
    <button type="button" class="btn btn-back" id="account-back-btn">戻る</button>

    <!-- サインアウト -->
    <form method="post" action="{% url 'logout' %}" style="display:inline;">
        {% csrf_token %}
        <button type="button"
                class="btn btn-logout"
                onclick="location.href='{% url 'logout' %}'">
            サインアウト
        </button>
    </form>
</div>

<script>
(function () {
    const btn = document.getElementById('account-back-btn');
    if (!btn) return;

    btn.addEventListener('click', function () {
        const ref = document.referrer;
        const sameOrigin = ref && ref.startsWith(location.origin);

        // --- ループ防止処理 ----------------------
        // アカウント更新画面 → アカウント画面 → 戻る のループを止める
        if (ref && ref.includes("/account_update")) {
            // 1回は戻るが、次の戻るは list_page に逃がす
            window.location.href = "{% url 'list_page' %}";
            return;
        }
        // -----------------------------------------

        if (sameOrigin) {
            window.location.href = ref;
        } else if (window.history.length > 1) {
            window.history.back();
        } else {
            window.location.href = "{% url 'list_page' %}";
        }
    });
})();
</script>
</main>


</body>
</html>
